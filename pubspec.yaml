name: min_market
description: "A production-grade Flutter e-commerce application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Navigation
  go_router: ^17.5.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  # bloc_concurrency: ^0.3.0 (incompatible with flutter_bloc 9.x)

  # Functional Programming & Error Handling
  fpdart: ^1.1.1

  # Network & API
  dio: ^5.11.1
  connectivity_plus: ^6.1.3

  # Local Storage & Persistence
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Environment Configuration (using --dart-define instead)
  # envied: ^0.5.4+1

  # Logging & Observability
  talker_flutter: ^4.5.1
  talker_dio_logger: ^4.5.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0

  bloc: any
  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.3.3
  # hive_generator: ^1.1.3 (incompatible with test SDK)
  # envied_generator: ^0.5.4+1

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  test: ^1.22.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/animations/